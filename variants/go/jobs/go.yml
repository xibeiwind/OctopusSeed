  # 主门禁线（Go）：vet / build / test。
  # vet 是 Go 自带的分析器——它的输出**必须当错误对待**（不进 CI 就等于没有门禁）。
  go:
    name: Go vet / 构建 / 测试
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.main != 'false' }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '{{CI_RUNNER}}') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 格式检查（gofmt 不得有输出）
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "::error::these files are not gofmt-ed:"; echo "$out"; exit 1; fi

      - name: 静态检查（vet）
        run: go vet ./...

      - name: 构建
        run: go build ./...

      # -count=1 关闭测试结果缓存，避免"上次过了这次不跑"。
      - name: 测试
        run: go test ./... -count=1

      # 主干可运行不变量（I1，CONTRIBUTING.md §6）：填入本栈的冒烟命令后**取消注释**。
      # 未填 = 本条**无保障**（§8.1 第 2 条纪律）——不要为"看起来有门禁"而留一条空过的命令。
      # - name: 冒烟（构建 -> 启动 -> 打一次真实请求）
      #   run: {{SMOKE_CMD}}
