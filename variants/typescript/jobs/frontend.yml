  # 前端 / 原型线（TypeScript）：安装 / 类型检查 / 测试 / 生产构建。
  # 为何单独成线：前端与主门禁**并列、互不阻塞**——前端失败不应挡住后端交付。
  # 关键细节：npm ci 严格按 lock 安装并校验其与 package.json（含 workspaces）一致，
  #          一旦 packages/* 的 package.json 入库而 lock 未同步，本步即失败（正是自举验证要抓的）。
  frontend:
    name: 前端安装 / 类型检查 / 测试 / 生产构建
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.frontend != 'false' }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '{{CI_RUNNER}}') }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend        # <- change to the real directory
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json   # <- change to the real path

      - name: 安装依赖（严格按 lock）
        run: npm ci

      - name: 类型检查（strict）
        run: npm run typecheck

      - name: 单元测试
        run: npm test

      - name: 生产构建
        run: npm run build
